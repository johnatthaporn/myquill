<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book.name }}</title>

    <!-- Highlight.js VS2015 Theme CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <!-- Highlight.js Core Library Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            color: #2c3e50;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 6px solid #b4e197;
        }
        .header-title {
            font-size: 26px;
            font-weight: 700;
            color: #333333;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            letter-spacing: -0.5px;
        }
        .content-box {
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .btn-blue {
            background-color: #cce5ff;
            color: #004085;
            box-shadow: 0 2px 5px rgba(204, 229, 255, 0.4);
        }
        .footer-links {
            margin-top: 20px;
            font-size: 14px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-top: 1px solid #f0f0f0;
            padding-top: 15px;
        }
        .footer-links a {
            color: #666666;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
            color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title">{{ book.name }}</h1>
        
        <div class="content-box">
            <!-- Safely renders the HTML content generated by Quill -->
            {{ book.properties.html|safe }}
        </div>

        <div class="footer-links">
            <!-- Fixed: Added book.pk here -->
            <a href="{% url 'book-update' book.pk %}" class="btn btn-blue">Update Book</a>
            <a href="{% url 'book-list' %}">&larr; Back to List</a>
        </div>
    </div>

    <!-- Custom JavaScript to transform ql-syntax blocks and trigger Highlight.js -->
    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            const syntaxBlocks = document.querySelectorAll("pre.ql-syntax");
            
            syntaxBlocks.forEach((block) => {
                if (!block.querySelector("code")) {
                    const originalContent = block.innerHTML;
                    block.innerHTML = `<code>${originalContent}</code>`;
                }
            });

            hljs.highlightAll();
        });
    </script>
</body>
</html>
